# render.yaml — Flower Smart Import Engine
# Deploy config for Render.com (Docker runtime)
# Designed and developed by ALTECH SOFTWARE DEVELOPERS

services:
  - type: web
    name: flower-smart-import
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: TESSDATA_PREFIX
        value: /usr/share/tesseract-ocr/4.00/tessdata
      - key: API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
